name: Deploy

# After CI passes on main: build Arm64 images, push them to GitHub Container Registry,
# then pull and restart them on the server over SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Image ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Native Arm runner (free for public repositories): no slow emulation for the Maven builds.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: accounts, context: backend, file: backend/Dockerfile, module: accounts-service }
          - { name: catalog, context: backend, file: backend/Dockerfile, module: catalog-service }
          - { name: mix, context: backend, file: backend/Dockerfile, module: mix-service }
          - { name: worker, context: worker, file: worker/Dockerfile, module: "" }
          - { name: web, context: web, file: web/Dockerfile, module: "" }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/naghma-mix-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/naghma-mix-${{ matrix.name }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  server:
    name: Roll out to server
    needs: images
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Skip when no server is configured
        if: env.SSH_HOST == ''
        run: echo "::notice::Images are pushed. Add SSH_HOST, SSH_USER and SSH_KEY secrets to deploy automatically (see docs/DEPLOYMENT.md)."
      - name: Pull and restart
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: SHA
          script: |
            set -e
            cd /opt/naghma-mix
            git fetch --quiet origin main
            git checkout --quiet "$SHA"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export TAG="$SHA"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
