# Serves the app and routes each API prefix to its service (same map as vite.config.ts).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 1m;  # audio goes straight to object storage, never through here
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/api/(auth|billing)(/|$) { proxy_pass http://accounts:8081; include /etc/nginx/conf.d/proxy.inc; }
    location ~ ^/api/(uploads|tracks|admin)(/|$) { proxy_pass http://catalog:8082; include /etc/nginx/conf.d/proxy.inc; }
    location ~ ^/api/(mix|sets)(/|$) { proxy_pass http://mix:8083; include /etc/nginx/conf.d/proxy.inc; }

    # Presigned uploads to object storage, on the app's own origin (no CORS). The path is
    # the bucket name (naghma.s3.bucket). The S3 signature covers the Host header, so it is
    # passed through unchanged, port included.
    location /naghma-audio/ {
        proxy_pass http://storage:9000;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        client_max_body_size 31m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
