quarkus.application.name=catalog-service
quarkus.http.port=8082

quarkus.datasource.db-kind=postgresql
# Tests get a throwaway database from Dev Services, so connection settings apply to dev and prod only.
%dev,prod.quarkus.datasource.username=${DB_USER:naghma}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:naghma}
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/naghma}
quarkus.hibernate-orm.database.default-schema=catalog
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=catalog
quarkus.flyway.create-schemas=true

mp.jwt.verify.issuer=https://naghma.mix
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:file:../../infra/keys/publicKey.pem}

# Object storage (RustFS in development). The public endpoint is the web app's own
# origin: nginx (or the Vite dev server) forwards /naghma-audio/ to storage.
naghma.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
naghma.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:5173}
naghma.s3.access-key=${S3_ACCESS_KEY:naghma}
naghma.s3.secret-key=${S3_SECRET_KEY:naghma-dev-secret}
naghma.s3.bucket=${S3_BUCKET:naghma-audio}

# Kafka
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
naghma.kafka.jobs-topic=analysis.jobs
mp.messaging.outgoing.analysis-jobs.connector=smallrye-kafka
mp.messaging.outgoing.analysis-jobs.topic=analysis.jobs
mp.messaging.outgoing.analysis-jobs.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.analysis-jobs.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.analysis-jobs.acks=all
mp.messaging.outgoing.analysis-jobs.enable.idempotence=true

mp.messaging.incoming.analysis-results.connector=smallrye-kafka
mp.messaging.incoming.analysis-results.topic=analysis.results
mp.messaging.incoming.analysis-results.group.id=catalog-service
mp.messaging.incoming.analysis-results.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.analysis-results.auto.offset.reset=earliest
mp.messaging.incoming.analysis-results.failure-strategy=dead-letter-queue
mp.messaging.incoming.analysis-results.dead-letter-queue.topic=analysis.results.dlq


quarkus.smallrye-openapi.path=/api/tracks/openapi
