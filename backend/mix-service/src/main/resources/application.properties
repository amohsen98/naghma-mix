quarkus.application.name=mix-service
quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:naghma}
quarkus.datasource.password=${DB_PASSWORD:naghma}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/naghma}
quarkus.hibernate-orm.database.default-schema=mix
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=mix
quarkus.flyway.create-schemas=true
%test.quarkus.datasource.jdbc.url=

mp.jwt.verify.issuer=https://naghma.mix
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:file:../../infra/keys/publicKey.pem}

quarkus.rest-client.catalog.url=${CATALOG_URL:http://localhost:8082}
quarkus.rest-client.catalog.connect-timeout=2000
quarkus.rest-client.catalog.read-timeout=5000

quarkus.smallrye-openapi.path=/api/mix/openapi
