quarkus.application.name=accounts-service
quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
# Tests get a throwaway database from Dev Services, so connection settings apply to dev and prod only.
%dev,prod.quarkus.datasource.username=${DB_USER:naghma}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:naghma}
%dev,prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/naghma}
quarkus.hibernate-orm.database.default-schema=accounts
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=accounts
quarkus.flyway.create-schemas=true

# JWT: this service signs, every service verifies with the public key
mp.jwt.verify.issuer=https://naghma.mix
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:file:../../infra/keys/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:file:../../infra/keys/privateKey.pem}
naghma.jwt.lifetime=PT12H

naghma.billing.webhook-secret=${BILLING_WEBHOOK_SECRET:dev-webhook-secret-change-me}
naghma.billing.public-url=${PUBLIC_URL:http://localhost:8080}

quarkus.smallrye-openapi.path=/api/auth/openapi
quarkus.log.console.json=false
